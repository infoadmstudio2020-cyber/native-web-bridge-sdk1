name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean Project
        run: ./gradlew clean --stacktrace

      - name: Build Release AAR and APK
        run: |
          ./gradlew :native-runtime-sdk:assembleRelease :app:assembleRelease --stacktrace || \
          ./gradlew :native-runtime-sdk:assembleRelease :app:assembleDebug --stacktrace || \
          ./gradlew :native-runtime-sdk:assembleRelease --stacktrace

      - name: Run unit tests
        run: |
          ./gradlew :native-runtime-sdk:test --stacktrace || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            native-runtime-sdk/build/outputs/aar/*.aar
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
