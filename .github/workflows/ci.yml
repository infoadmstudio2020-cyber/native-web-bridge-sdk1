name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean Project
        run: ./gradlew clean --stacktrace

      - name: Build Release AAR and Debug APK
        run: |
          ./gradlew :native-runtime-sdk:assembleRelease :app:assembleDebug --stacktrace || \
          ./gradlew :native-runtime-sdk:assembleRelease --stacktrace

      - name: Run unit tests
        run: |
          ./gradlew :native-runtime-sdk:test --stacktrace || true
